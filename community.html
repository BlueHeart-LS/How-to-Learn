<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>學習社群｜如何學 How to Learn</title>
    <link rel="icon" type="image/png" href="images/icon_logo.png" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="index.html" aria-label="如何學首頁">
          <img src="images/LOGO.png" alt="如何學 How to Learn" />
        </a>

        <nav class="main-nav" aria-label="主要導覽">
          <a href="index.html">首頁</a>
          <a href="explore.html">學習探索</a>
          <a href="methods.html">學習方法</a>
          <a class="active" href="community.html">學習社群</a>
          <a href="resources.html">資源專區</a>
          <a href="about.html">關於我們</a>
        </nav>

        <div class="header-actions">
          <button class="icon-button" type="button" aria-label="搜尋">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16.5 16.5 4 4"></path></svg>
          </button>
          <button class="login-button" type="button" data-login-modal>會員登入</button>
        </div>
      </header>

      <main>
        <section class="community-hero">
          <p class="section-kicker">Learning Community</p>
          <h1>學習社群</h1>
          <p>分享你的學習進度、卡關問題與小小突破，和其他學習者一起交流。</p>
        </section>

        <section class="community-layout">
          <form class="post-composer" data-post-form>
            <h2>發布新貼文</h2>
            <label>
              名字
              <input name="author" placeholder="你的暱稱" required />
            </label>
            <label>
              標題
              <input name="title" placeholder="想分享什麼？" required />
            </label>
            <label>
              內容
              <textarea name="content" rows="5" placeholder="寫下你的想法、問題或今天的學習成果" required></textarea>
            </label>
            <button class="primary-button" type="submit">發布貼文</button>
          </form>

          <div class="community-feed" data-community-feed aria-live="polite"></div>
        </section>
      </main>

      <footer class="site-footer">
        <a class="brand footer-brand" href="index.html">
          <img src="images/LOGO.png" alt="如何學 How to Learn" />
        </a>
        <nav aria-label="頁尾導覽">
          <a href="index.html">首頁</a>
          <a href="explore.html">學習探索</a>
          <a href="methods.html">學習方法</a>
          <a href="community.html">學習社群</a>
          <a href="resources.html">資源專區</a>
          <a href="about.html">關於我們</a>
        </nav>
        <div class="socials" aria-label="社群連結">
          <a href="#" aria-label="Instagram"><img src="images/icon_instagram.png" alt="" /></a>
          <a href="#" aria-label="Facebook"><img src="images/icon_facebook.png" alt="" /></a>
          <a href="#" aria-label="YouTube"><img src="images/icon_youtube.png" alt="" /></a>
          <a href="#" aria-label="Email"><img src="images/icon_email.png" alt="" /></a>
        </div>
      </footer>

      <div class="modal-overlay" data-modal-overlay hidden>
        <div class="coming-soon-modal" role="dialog" aria-modal="true" aria-labelledby="coming-soon-title">
          <h2 id="coming-soon-title">開發中，敬請期待</h2>
        </div>
      </div>
    </div>
    <script src="js/community.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
