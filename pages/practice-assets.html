<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body, body * { cursor: url("../images/mouse_cursor.png") 4 4, auto !important; }
      a, button, input, select, textarea, [role="button"] { cursor: url("../images/mouse_cursor.png") 4 4, pointer !important; }
      html:active, body:active, body:active *, a:active, button:active, input:active, select:active, textarea:active, [role="button"]:active { cursor: url("../images/mouse_touch_cursor.png") 4 4, pointer !important; }
    </style>
    <title>主題練習包｜如何學 How to Learn</title>
    <link rel="icon" type="image/png" href="../images/icon_logo.png" />
    
    <link rel="preload" href="../fonts/jf-openhuninn-2.1.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="../fonts/Iansui-Regular.ttf" as="font" type="font/ttf" crossorigin />
<link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="../index.html" aria-label="如何學首頁">
          <img src="../images/LOGO.png" alt="如何學 How to Learn" />
        </a>

        <nav class="main-nav" aria-label="主要導覽">
          <a href="start.html">如何開始</a>
          <a href="explore.html">自我探索</a>
          <a href="methods.html">學習方法</a>
          <a href="games.html">遊戲練習</a>
          <a class="active" href="resources.html">資源專區</a>
          <a href="about.html">關於我們</a>
        </nav>

        <div class="header-actions">
          <button class="icon-button" type="button" aria-label="搜尋">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16.5 16.5 4 4"></path></svg>
          </button>
          <button class="login-button" type="button" data-login-modal>會員登入</button>
        </div>
      </header>

      <main>
        <section class="resource-hero">
          <p class="section-kicker">Practice Assets</p>
          <h1>主題練習包</h1>
          <p>點擊圖片可放大預覽，使用下載連結領取練習圖檔。</p>
        </section>

        <section class="asset-section" aria-label="主題練習包素材">
          <div class="asset-layout">
            <aside class="asset-age-filter" aria-label="主題包分類">
              <p>推薦年齡</p>
              <div class="asset-filter-buttons">
                <button class="asset-filter-button active" type="button" data-asset-filter="all" aria-pressed="true">全部素材</button>
                <button class="asset-filter-button" type="button" data-asset-filter="general" aria-pressed="false">通用</button>
                <button class="asset-filter-button" type="button" data-asset-filter="preschool" aria-pressed="false">學前</button>
                <button class="asset-filter-button" type="button" data-asset-filter="lower" aria-pressed="false">國小(低)</button>
                <button class="asset-filter-button" type="button" data-asset-filter="middle" aria-pressed="false">國小(中)</button>
                <button class="asset-filter-button" type="button" data-asset-filter="upper" aria-pressed="false">國小(高)</button>
                <button class="asset-filter-button" type="button" data-asset-filter="junior" aria-pressed="false">國中</button>
                <button class="asset-filter-button" type="button" data-asset-filter="senior" aria-pressed="false">高中</button>
              </div>

              <p>學科分類</p>
              <div class="asset-filter-buttons">
                <button class="asset-filter-button active" type="button" data-subject-filter="all" aria-pressed="true">全部學科</button>
                <button class="asset-filter-button" type="button" data-subject-filter="chinese" aria-pressed="false">國語文</button>
                <button class="asset-filter-button" type="button" data-subject-filter="english" aria-pressed="false">英語文</button>
                <button class="asset-filter-button" type="button" data-subject-filter="math" aria-pressed="false">數學</button>
                <button class="asset-filter-button" type="button" data-subject-filter="social" aria-pressed="false">社會</button>
                <button class="asset-filter-button" type="button" data-subject-filter="science" aria-pressed="false">自然</button>
                <button class="asset-filter-button" type="button" data-subject-filter="life" aria-pressed="false">生活</button>
              </div>
            </aside>

            <div class="asset-content">
              <div class="asset-grid" data-asset-grid></div>
              <p class="asset-empty" data-asset-empty hidden>目前這個年齡或學科組合還沒有上架的練習包，之後可以再補新的素材。</p>
            </div>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <a class="brand footer-brand" href="../index.html">
          <img src="../images/LOGO.png" alt="如何學 How to Learn" />
        </a>
        <nav aria-label="頁尾導覽">
          <a href="start.html">如何開始</a>
          <a href="explore.html">自我探索</a>
          <a href="methods.html">學習方法</a>
          <a href="games.html">遊戲練習</a>
          <a href="resources.html">資源專區</a>
          <a href="about.html">關於我們</a>
        </nav>
        <div class="socials" aria-label="社群連結">
          <a href="#" aria-label="Instagram"><img src="../images/icon_instagram.png" alt="" loading="lazy" decoding="async" /></a>
          <a href="#" aria-label="Facebook"><img src="../images/icon_facebook.png" alt="" loading="lazy" decoding="async" /></a>
          <a href="#" aria-label="YouTube"><img src="../images/icon_youtube.png" alt="" loading="lazy" decoding="async" /></a>
          <a href="#" aria-label="Email"><img src="../images/icon_email.png" alt="" loading="lazy" decoding="async" /></a>
        </div>
      </footer>

      <div class="modal-overlay" data-modal-overlay hidden>
        <div class="coming-soon-modal" role="dialog" aria-modal="true" aria-labelledby="coming-soon-title">
          <h2 id="coming-soon-title">開發中，敬請期待</h2>
        </div>
      </div>
    </div>

    <div class="image-preview-overlay" data-image-preview hidden>
      <figure class="image-preview-frame">
        <img src="" alt="" data-preview-output loading="lazy" decoding="async" />
        <figcaption data-preview-caption></figcaption>
      </figure>
    </div>

    <script src="../js/resource-preview.js"></script>
    <script src="../js/main.js"></script>
  </body>
</html>
