<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preload" as="image" href="../images/mouse_cursor.png" />
    <link rel="preload" as="image" href="../images/mouse_touch_cursor.png" />
    <style>
      html, body, body * { cursor: url("../images/mouse_cursor.png") 4 4, auto !important; }
      a, button, input, select, textarea, [role="button"] { cursor: url("../images/mouse_cursor.png") 4 4, pointer !important; }
      html:active, body:active, body:active *, a:active, button:active, input:active, select:active, textarea:active, [role="button"]:active { cursor: url("../images/mouse_touch_cursor.png") 4 4, pointer !important; }
    </style>
    <title>字音字形練習｜如何學 How to Learn</title>
    <link rel="icon" type="image/png" href="../images/icon_logo.png" />
    
    <link rel="preload" href="../fonts/jf-openhuninn-2.1.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="../fonts/Iansui-Regular.ttf" as="font" type="font/ttf" crossorigin />
<link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="../index.html" aria-label="如何學首頁">
          <img src="../images/LOGO.png" alt="如何學 How to Learn" />
        </a>

        <nav class="main-nav" aria-label="主要導覽">
          <a href="start.html">如何開始</a>
          <a href="explore.html">自我探索</a>
          <a href="methods.html">學習方法</a>
          <a class="active" href="games.html">遊戲練習</a>
          <a href="resources.html">資源專區</a>
          <a href="about.html">關於我們</a>
        </nav>

        <div class="header-actions">
          <button class="icon-button" type="button" aria-label="搜尋">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16.5 16.5 4 4"></path></svg>
          </button>
          <button class="login-button" type="button" data-login-modal>會員登入</button>
        </div>
      </header>

      <main>
        <section class="word-game-hero">
          <p class="section-kicker">Chinese Game</p>
          <h1>字音字形練習</h1>
          <p>選擇適合的程度，進行 6 題快問快答。題目混合字音辨識與字形判斷，答完立即顯示結果並自動前進。</p>
        </section>

        <section class="word-game-shell" data-word-game>
          <div class="word-game-status">
            <div><span>目前進度</span><strong data-word-progress>0 / 6</strong></div>
            <div><span>答對題數</span><strong data-word-score>0</strong></div>
            <div><span>練習程度</span><strong data-word-level>尚未選擇</strong></div>
          </div>

          <div class="word-game-intro" data-word-intro>
            <h2>先選一組開始</h2>
            <p>每組題目都會同時練到字音與字形。完成後會看到正確率，也會提示目前比較需要補強哪一類。</p>
            <div class="word-level-picker" aria-label="選擇練習程度">
              <button type="button" data-word-start="elementary">國小</button>
              <button type="button" data-word-start="junior">國中</button>
              <button type="button" data-word-start="senior">高中</button>
            </div>
          </div>

          <div class="word-question-panel" data-word-play hidden>
            <div class="word-question-heading">
              <p class="word-question-type" data-word-type></p>
              <p class="word-question-count" data-word-count></p>
            </div>
            <h2 data-word-question></h2>
            <div class="word-options" data-word-options></div>
            <p class="word-feedback" data-word-feedback aria-live="polite"></p>
            <p class="word-explanation" data-word-explanation></p>
          </div>

          <div class="word-game-result" data-word-result hidden>
            <p class="section-kicker">Result</p>
            <h2>練習完成</h2>
            <p data-word-summary></p>
            <div class="result-action-row">
              <button class="primary-button" type="button" data-word-restart>重新選擇</button>
              <a class="secondary-button" href="games.html">返回遊戲練習</a>
            </div>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <a class="brand footer-brand" href="../index.html">
          <img src="../images/LOGO.png" alt="如何學 How to Learn" />
        </a>
        <nav aria-label="頁尾導覽">
          <a href="start.html">如何開始</a>
          <a href="explore.html">自我探索</a>
          <a href="methods.html">學習方法</a>
          <a href="games.html">遊戲練習</a>
          <a href="resources.html">資源專區</a>
          <a href="about.html">關於我們</a>
        </nav>
        <div class="socials" aria-label="社群連結">
          <a href="#" aria-label="Instagram"><img src="../images/icon_instagram.png" alt="" loading="lazy" decoding="async" /></a>
          <a href="#" aria-label="Facebook"><img src="../images/icon_facebook.png" alt="" loading="lazy" decoding="async" /></a>
          <a href="#" aria-label="YouTube"><img src="../images/icon_youtube.png" alt="" loading="lazy" decoding="async" /></a>
          <a href="#" aria-label="Email"><img src="../images/icon_email.png" alt="" loading="lazy" decoding="async" /></a>
        </div>
      </footer>

      <div class="modal-overlay" data-modal-overlay hidden>
        <div class="coming-soon-modal" role="dialog" aria-modal="true" aria-labelledby="coming-soon-title">
          <h2 id="coming-soon-title">開發中，敬請期待</h2>
        </div>
      </div>
    </div>
    <script src="../js/games/word-sound-shape-game.js"></script>
    <script src="../js/main.js"></script>
  </body>
</html>
