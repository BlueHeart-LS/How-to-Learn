    <meta charset="utf-8" />

      html, body, body * { cursor: url("../images/mouse_cursor.png") 4 4, auto !important; }
      a, button, input, select, textarea, [role="button"] { cursor: url("../images/mouse_cursor.png") 4 4, pointer !important; }
      html:active, body:active, body:active *, a:active, button:active, input:active, select:active, textarea:active, [role="button"]:active { cursor: url("../images/mouse_touch_cursor.png") 4 4, pointer !important; }
    </style>
    <title>學習寵物｜如何學 How to Learn</title>
    <link rel="icon" type="image/png" href="../images/icon_logo.png" />
    <link rel="preload" href="../fonts/jf-openhuninn-2.1.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="../fonts/Iansui-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="../index.html" aria-label="如何學首頁">
          <img src="../images/LOGO.png" alt="如何學 How to Learn" />
        </a>

        <nav class="main-nav" aria-label="主要導覽">
          <a href="start.html">如何開始</a>
          <a href="explore.html">自我探索</a>
          <a href="methods.html">學習方法</a>
          <a class="active" href="games.html">遊戲練習</a>
          <a href="resources.html">資源專區</a>
          <a href="about.html">關於我們</a>
        </nav>

        <div class="header-actions">
          <button class="icon-button" type="button" aria-label="搜尋">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16.5 16.5 4 4"></path></svg>
          </button>
          <button class="login-button" type="button" data-login-modal>會員登入</button>
        </div>
      </header>

      <main>
        <section class="pet-hero">
          <p class="section-kicker">Study Pet</p>
          <h1>學習寵物</h1>
          <p>完成練習遊戲獲得學習金幣，再回來餵食、陪玩與照顧你的電子雞風格學習小夥伴。</p>
        </section>

        <section class="pet-game-shell" data-pet-game>
          <div class="pet-stage-panel">
            <div class="pet-wallet-card">
              <span>學習金幣</span>
              <strong data-pet-wallet>0</strong>
              <small>完成練習遊戲可以獲得</small>
            </div>

            <div class="pet-creature" data-pet-creature aria-label="學習寵物狀態">
              <span class="pet-ear left"></span>
              <span class="pet-ear right"></span>
              <span class="pet-face">
                <i></i><i></i>
                <b></b>
              </span>
              <span class="pet-shadow"></span>
            </div>

            <div class="pet-message" data-pet-message>嗨！去完成幾個練習關卡，我就有飼料可以吃了。</div>
          </div>

          <div class="pet-care-panel">
            <div class="pet-name-row">
              <div>
                <p class="section-kicker">Status</p>
                <h2 data-pet-name>小學伴</h2>
              </div>
              <button class="tool-button" type="button" data-pet-rename>改名</button>
            </div>

            <div class="pet-stat-list">
              <div>
                <span>飽足</span>
                <strong data-pet-hunger>80</strong>
                <i><b data-pet-hunger-bar></b></i>
              </div>
              <div>
                <span>心情</span>
                <strong data-pet-happy>80</strong>
                <i><b data-pet-happy-bar></b></i>
              </div>
              <div>
                <span>精神</span>
                <strong data-pet-energy>80</strong>
                <i><b data-pet-energy-bar></b></i>
              </div>
            </div>

            <div class="pet-action-grid">
              <button type="button" data-pet-action="feed">
                <span>飼料</span>
                <strong>餵食</strong>
                <small>花 10 金幣，飽足 +18</small>
              </button>
              <button type="button" data-pet-action="treat">
                <span>點心</span>
                <strong>小獎勵</strong>
                <small>花 18 金幣，心情 +22</small>
              </button>
              <button type="button" data-pet-action="play">
                <span>玩具</span>
                <strong>陪牠玩</strong>
                <small>花 25 金幣，心情 +30、精神 -8</small>
              </button>
              <button type="button" data-pet-action="rest">
                <span>休息</span>
                <strong>睡一下</strong>
                <small>免費，精神 +20</small>
              </button>
            </div>

            <div class="pet-growth-card">
              <span>成長等級</span>
              <strong data-pet-level>Lv.1</strong>
              <p data-pet-growth>累積照顧 0 次。多完成練習、多照顧牠，牠會慢慢長大。</p>
            </div>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <a class="brand footer-brand" href="../index.html">
          <img src="../images/LOGO.png" alt="如何學 How to Learn" />
        </a>
        <nav aria-label="頁尾導覽">
          <a href="start.html">如何開始</a>
          <a href="explore.html">自我探索</a>
          <a href="methods.html">學習方法</a>
          <a href="games.html">遊戲練習</a>
          <a href="resources.html">資源專區</a>
          <a href="about.html">關於我們</a>
        </nav>
        <div class="socials" aria-label="社群連結">
          <a href="#" aria-label="Instagram"><img src="../images/icon_instagram.png" alt="" /></a>
          <a href="#" aria-label="Facebook"><img src="../images/icon_facebook.png" alt="" /></a>
          <a href="#" aria-label="YouTube"><img src="../images/icon_youtube.png" alt="" /></a>
          <a href="#" aria-label="Email"><img src="../images/icon_email.png" alt="" /></a>
        </div>
      </footer>

      <div class="modal-overlay" data-modal-overlay hidden>
        <div class="coming-soon-modal" role="dialog" aria-modal="true" aria-labelledby="coming-soon-title">
          <h2 id="coming-soon-title">開發中，敬請期待</h2>
        </div>
      </div>
    </div>
    <script src="../js/main.js"></script>
    <script src="../js/study-pet-game.js"></script>
  </body>
</html>
