<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preload" as="image" href="../images/mouse_cursor.png" />
    <link rel="preload" as="image" href="../images/mouse_touch_cursor.png" />
    <style>
      html, body, body * { cursor: url("../images/mouse_cursor.png") 4 4, auto !important; }
      a, button, input, select, textarea, [role="button"] { cursor: url("../images/mouse_cursor.png") 4 4, pointer !important; }
      html:active, body:active, body:active *, a:active, button:active, input:active, select:active, textarea:active, [role="button"]:active { cursor: url("../images/mouse_touch_cursor.png") 4 4, pointer !important; }
    </style>
    <title>筆記整理實驗室｜如何學 How to Learn</title>
    <link rel="icon" type="image/png" href="../images/icon_logo.png" />
    
    <link rel="preload" href="../fonts/jf-openhuninn-2.1.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="../fonts/Iansui-Regular.ttf" as="font" type="font/ttf" crossorigin />
<link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="../index.html" aria-label="如何學首頁">
          <img src="../images/LOGO.png" alt="如何學 How to Learn" />
        </a>

        <nav class="main-nav" aria-label="主要導覽">
          <a href="start.html">如何開始</a>
          <a class="active" href="explore.html">自我探索</a>
          <a href="methods.html">學習方法</a>
          <a href="games.html">遊戲練習</a>
          <a href="resources.html">資源專區</a>
          <a href="about.html">關於我們</a>
        </nav>

        <div class="header-actions">
          <button class="icon-button" type="button" aria-label="搜尋">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16.5 16.5 4 4"></path></svg>
          </button>
          <button class="login-button" type="button" data-login-modal>會員登入</button>
        </div>
      </header>

      <main>
        <section class="note-lab-hero">
          <p class="section-kicker">Note Lab</p>
          <h1>筆記整理實驗室</h1>
          <p>把零散資訊整理成清楚的知識架構。點選一張筆記，再放到你覺得最適合的分類區。</p>
        </section>

        <section class="note-lab-game" data-note-lab>
          <div class="note-lab-status">
            <div><span>已整理</span><strong data-note-progress>0 / 8</strong></div>
            <div><span>正確率</span><strong data-note-accuracy>0%</strong></div>
          </div>

          <div class="note-lab-board">
            <div class="note-stack" aria-label="待整理筆記">
              <h2>零散筆記</h2>
              <p>先選一張，再選右邊分類。</p>
              <div class="note-card-list" data-note-cards></div>
            </div>

            <div class="note-categories" aria-label="筆記分類區" data-note-categories>
              <button class="note-category" type="button" data-category="concept">
                <span>核心概念</span>
                <small>定義、原理、重要觀念</small>
              </button>
              <button class="note-category" type="button" data-category="example">
                <span>例子與應用</span>
                <small>情境、案例、可以怎麼用</small>
              </button>
              <button class="note-category" type="button" data-category="question">
                <span>疑問與待查</span>
                <small>還不懂、需要確認的內容</small>
              </button>
              <button class="note-category" type="button" data-category="action">
                <span>下一步行動</span>
                <small>練習、複習、要做的事</small>
              </button>
            </div>
          </div>

          <p class="note-lab-feedback" data-note-feedback></p>

          <div class="note-lab-result" data-note-result hidden>
            <h2>整理完成</h2>
            <p data-note-summary></p>
            <button class="primary-button" type="button" data-note-restart>再整理一次 <span aria-hidden="true">→</span></button>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <a class="brand footer-brand" href="../index.html">
          <img src="../images/LOGO.png" alt="如何學 How to Learn" />
        </a>
        <nav aria-label="頁尾導覽">
          <a href="start.html">如何開始</a>
          <a href="explore.html">自我探索</a>
          <a href="methods.html">學習方法</a>
          <a href="games.html">遊戲練習</a>
          <a href="resources.html">資源專區</a>
          <a href="about.html">關於我們</a>
        </nav>
        <div class="socials" aria-label="社群連結">
          <a href="#" aria-label="Instagram"><img src="../images/icon_instagram.png" alt="" loading="lazy" decoding="async" /></a>
          <a href="#" aria-label="Facebook"><img src="../images/icon_facebook.png" alt="" loading="lazy" decoding="async" /></a>
          <a href="#" aria-label="YouTube"><img src="../images/icon_youtube.png" alt="" loading="lazy" decoding="async" /></a>
          <a href="#" aria-label="Email"><img src="../images/icon_email.png" alt="" loading="lazy" decoding="async" /></a>
        </div>
      </footer>

      <div class="modal-overlay" data-modal-overlay hidden>
        <div class="coming-soon-modal" role="dialog" aria-modal="true" aria-labelledby="coming-soon-title">
          <h2 id="coming-soon-title">開發中，敬請期待</h2>
        </div>
      </div>
    </div>
    <script src="../js/note-lab.js"></script>
    <script src="../js/main.js"></script>
  </body>
</html>
