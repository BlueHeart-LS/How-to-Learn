<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body, body * { cursor: url("../images/mouse_cursor.png") 4 4, auto !important; }
      a, button, input, select, textarea, [role="button"] { cursor: url("../images/mouse_cursor.png") 4 4, pointer !important; }
      html:active, body:active, body:active *, a:active, button:active, input:active, select:active, textarea:active, [role="button"]:active { cursor: url("../images/mouse_touch_cursor.png") 4 4, pointer !important; }
    </style>
    <title>編輯文章｜如何學 How to Learn</title>
    <link rel="icon" type="image/png" href="../images/icon_logo.png" />
    
    <link rel="preload" href="../fonts/jf-openhuninn-2.1.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="../fonts/Iansui-Regular.ttf" as="font" type="font/ttf" crossorigin />
<link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="../index.html" aria-label="如何學首頁">
          <img src="../images/LOGO.png" alt="如何學 How to Learn" />
        </a>

        <nav class="main-nav" aria-label="主要導覽">
          <a href="start.html">如何開始</a>
          <a href="explore.html">自我探索</a>
          <a href="methods.html">學習方法</a>
          <a href="games.html">遊戲練習</a>
          <a href="resources.html">資源專區</a>
          <a href="about.html">關於我們</a>
        </nav>

        <div class="header-actions">
          <button class="login-button" type="button" data-login-modal>會員登入</button>
        </div>
      </header>

      <main>
        <section class="admin-hero">
          <p class="section-kicker">Article Admin</p>
          <h1>編輯文章</h1>
          <p>修改文章內容、封面、摘要與分類，儲存後會同步到前台文章列表。</p>
        </section>

        <section class="admin-layout">
          <aside class="admin-list">
            <h2>文章列表</h2>
            <div data-admin-list></div>
            <a class="secondary-button small" href="admin-articles.html">返回列表</a>
            <button class="primary-button small" type="button" data-new-article>新增文章</button>
          </aside>

          <form class="admin-form" data-article-form>
            <label>
              文章代號
              <input name="slug" placeholder="由標題自動生成" readonly required />
            </label>
            <label>
              標題
              <input name="title" required  />
            </label>
            <div class="admin-form-grid">
              <label>
                分類
                <select name="category" required>
                  <option value="">請選擇分類</option>
                  <option value="學習方法">學習方法</option>
                  <option value="時間管理">時間管理</option>
                  <option value="專注力提升">專注力提升</option>
                  <option value="學科知識">學科知識</option>
                  <option value="自我探索">自我探索</option>
                  <option value="職涯探索">職涯探索</option>
                  <option value="教育觀點">教育觀點</option>
                  <option value="科技與AI">科技與AI</option>
                  <option value="遊戲學習">遊戲學習</option>
                </select>
              </label>
              <label>
                作者
                <input name="author" placeholder="如何學編輯部" />
              </label>
            </div>
            <div class="admin-form-grid">
              <label>
                上傳日期
                <input name="date" type="date" />
              </label>
            </div>
            <div class="admin-form-grid">
              <label>
                封面圖片
                <input name="coverImageFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif" />
              </label>
            </div>
            <p class="admin-note" data-cover-image-status>尚未選擇封面圖片</p>
            <label>
              標籤
              <input name="tags" placeholder="用逗號分隔，例如：記憶,複習,練習" />
            </label>
            <label>
              卡片摘要
              <input name="excerpt" placeholder="文章卡上的簡短摘要" />
            </label>
            <label>
              內文
              <textarea name="body" rows="10" placeholder="每一段用空行分隔"></textarea>
            </label>
            <div class="admin-actions">
              <button class="primary-button" type="submit">儲存文章</button>
              <button class="secondary-button" type="button" data-delete-article>刪除文章</button>
              <a class="secondary-button" data-preview-link href="article.html" target="_blank">預覽文章</a>
            </div>
            <p class="admin-note" data-save-status>尚未儲存變更</p>
          </form>
        </section>
      </main>

      <div class="modal-overlay" data-modal-overlay hidden>
        <div class="coming-soon-modal" role="dialog" aria-modal="true" aria-labelledby="coming-soon-title">
          <h2 id="coming-soon-title">開發中，敬請期待</h2>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/auth.js?v=admin-list-1"></script>
    <script src="../js/articles.js?v=admin-list-1"></script>
    <script src="../js/admin.js?v=admin-list-1"></script>
    <script src="../js/main.js?v=admin-list-1"></script>
  </body>
</html>
