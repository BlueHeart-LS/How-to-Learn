      <main>
        <section class="word-game-hero"><p class="section-kicker">Chinese Game</p><h1>國小字音字形練習</h1><p>先選字音或字形，再用快問快答練習最常見的讀音與用字。</p></section>
        <section class="word-game-shell chinese-game-shell" data-chinese-game data-chinese-level="elementary">
          <div class="word-game-status"><div><span>目前進度</span><strong data-chinese-progress>0 / 6</strong></div><div><span>答對題數</span><strong data-chinese-score>0</strong></div><div><span>練習模式</span><strong data-chinese-mode-label>字音</strong></div></div>
          <div class="word-game-intro" data-chinese-intro><h2>選擇練習內容</h2><p>字音練讀音辨識；字形會以句子挖空，選出最正確的單字。</p><div class="vocab-setting-row chinese-mode-row"><button class="vocab-chip active" type="button" data-chinese-mode="sound" aria-pressed="true">字音</button><button class="vocab-chip" type="button" data-chinese-mode="shape" aria-pressed="false">字形</button></div><button class="primary-button" type="button" data-chinese-start>開始練習</button></div>
          <div class="word-question-panel" data-chinese-play hidden><div class="word-question-heading"><p class="word-question-type" data-chinese-type></p><p class="word-question-count" data-chinese-count></p></div><h2 data-chinese-question></h2><div class="word-options" data-chinese-options></div><p class="word-feedback" data-chinese-feedback aria-live="polite"></p><p class="word-explanation" data-chinese-explanation></p></div>
          <div class="word-game-result" data-chinese-result hidden><p class="section-kicker">Result</p><h2>練習完成</h2><p data-chinese-summary></p><div class="result-action-row"><button class="primary-button" type="button" data-chinese-replay>再玩一次</button><button class="secondary-button" type="button" data-chinese-restart>重選模式</button></div></div>
        </section>
