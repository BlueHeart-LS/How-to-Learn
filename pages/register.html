<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body, body * { cursor: url("../images/mouse_cursor.png") 4 4, auto !important; }
      a, button, input, select, textarea, [role="button"] { cursor: url("../images/mouse_cursor.png") 4 4, pointer !important; }
      html:active, body:active, body:active *, a:active, button:active, input:active, select:active, textarea:active, [role="button"]:active { cursor: url("../images/mouse_touch_cursor.png") 4 4, pointer !important; }
    </style>
    <title>會員註冊｜如何學 How to Learn</title>
    <link rel="icon" type="image/png" href="../images/icon_logo.png" />
    <link rel="preload" href="../fonts/jf-openhuninn-2.1.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="../fonts/Iansui-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="../index.html" aria-label="如何學首頁">
          <img src="../images/LOGO.png" alt="如何學 How to Learn" />
        </a>
        <nav class="main-nav" aria-label="主要導覽">
          <a href="start.html">如何開始</a>
          <a href="explore.html">自我探索</a>
          <a href="methods.html">學習方法</a>
          <a href="games.html">遊戲練習</a>
          <a href="resources.html">資源專區</a>
          <a href="about.html">關於我們</a>
        </nav>
        <div class="header-actions">
          <button class="login-button" type="button" data-login-modal>會員登入</button>
        </div>
      </header>

      <main>
        <section class="auth-page">
          <div class="auth-card">
            <p class="section-kicker">Create Account</p>
            <h1>會員註冊</h1>
            <form class="auth-form" data-register-form>
              <label>
                名稱
                <input name="name" autocomplete="name" required />
              </label>
              <label>
                Email
                <input name="email" type="email" autocomplete="email" required />
              </label>
              <label>
                密碼
                <input name="password" type="password" autocomplete="new-password" minlength="6" required />
              </label>
              <label>
                確認密碼
                <input name="confirmPassword" type="password" autocomplete="new-password" minlength="6" required />
              </label>
              <button class="primary-button" type="submit">建立帳號</button>
              <p class="admin-note" data-auth-status></p>
            </form>
            <p class="auth-switch">已經有帳號？<a href="login.html">前往登入</a></p>
          </div>
        </section>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/auth.js?v=views-2"></script>
    <script src="../js/main.js"></script>
  </body>
</html>
