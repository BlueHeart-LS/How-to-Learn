      html, body, body * { cursor: url("../images/mouse_cursor.png") 4 4, auto !important; }
      a, button, input, select, textarea, [role="button"] { cursor: url("../images/mouse_cursor.png") 4 4, pointer !important; }
      html:active, body:active, body:active *, a:active, button:active, input:active, select:active, textarea:active, [role="button"]:active { cursor: url("../images/mouse_touch_cursor.png") 4 4, pointer !important; }
    </style>
    <title>分數小數轉換｜如何學 How to Learn</title>
    <link rel="icon" type="image/png" href="../images/icon_logo.png" />
    
    <link rel="preload" href="../fonts/jf-openhuninn-2.1.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="../fonts/Iansui-Regular.ttf" as="font" type="font/ttf" crossorigin />
<link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="../index.html" aria-label="如何學首頁">
          <img src="../images/LOGO.png" alt="如何學 How to Learn" />
        </a>

        <nav class="main-nav" aria-label="主要導覽">
          <a href="start.html">如何開始</a>
          <a href="explore.html">自我探索</a>
          <a href="methods.html">學習方法</a>
          <a class="active" href="games.html">遊戲練習</a>
          <a href="resources.html">資源專區</a>
          <a href="about.html">關於我們</a>
        </nav>

        <div class="header-actions">
          <button class="icon-button" type="button" aria-label="搜尋">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16.5 16.5 4 4"></path></svg>
          </button>
          <button class="login-button" type="button" data-login-modal>會員登入</button>
        </div>
      </header>

      <main>
        <section class="multiplication-hero fraction-game-hero">
          <p class="section-kicker">Math Game</p>
          <h1>分數小數轉換</h1>
          <p>把分數、小數、比率與百分率放在同一張轉換地圖裡，練習看見它們其實在描述同一個量。</p>
        </section>

        <section class="fraction-game-shell" data-fraction-game>
          <div class="word-game-status fraction-game-status">
            <div>
              <span>目前題號</span>
              <strong data-current-count>0/10</strong>
            </div>
            <div>
              <span>答對題數</span>
              <strong data-game-score>0</strong>
            </div>
            <div>
              <span>正確率</span>
              <strong data-game-accuracy>0%</strong>
            </div>
          </div>

          <div class="fraction-game-intro" data-game-intro>
            <h2>選擇今天的轉換範圍</h2>
            <p>預設會練習分數和小數互換。想增加挑戰時，可以把比率、百分率也加入題庫。</p>

            <div class="fraction-setting-block">
              <span>題數</span>
              <div class="vocab-setting-row" role="group" aria-label="題數">
                <button class="vocab-chip" type="button" data-question-count="5">5 題</button>
                <button class="vocab-chip active" type="button" data-question-count="10">10 題</button>
                <button class="vocab-chip" type="button" data-question-count="20">20 題</button>
              </div>
            </div>

            <div class="fraction-setting-block">
              <span>加入題型</span>
              <div class="fraction-mode-row" aria-label="加入題型">
                <label>
                  <input type="checkbox" data-include-ratio />
                  <span>比率</span>
                </label>
                <label>
                  <input type="checkbox" data-include-percent />
                  <span>百分率</span>
                </label>
              </div>
            </div>

            <button class="primary-button" type="button" data-game-start>開始遊戲 <span aria-hidden="true">→</span></button>
          </div>

          <div class="fraction-question-panel" data-question-panel hidden>
            <div class="fraction-question-heading">
              <span class="word-question-type" data-question-type>分數 → 小數</span>
              <span class="word-question-count" data-question-progress>第 1 題 / 共 10 題</span>
            </div>
            <h2 data-question-text></h2>
            <div class="fraction-visual" data-question-visual aria-hidden="true"></div>
            <div class="word-options fraction-options" data-answer-options></div>
            <p class="word-feedback" data-game-feedback></p>
            <p class="word-explanation" data-game-explanation></p>
          </div>

          <div class="fraction-game-result" data-game-result hidden>
            <h2>練習完成</h2>
            <p data-result-summary></p>
            <div class="result-action-row">
              <button class="primary-button" type="button" data-game-restart>再玩一次 <span aria-hidden="true">→</span></button>
              <button class="secondary-button" type="button" data-mode-reset>重選範圍</button>
              <a class="secondary-button" href="games.html">返回遊戲練習</a>
            </div>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <a class="brand footer-brand" href="../index.html">
          <img src="../images/LOGO.png" alt="如何學 How to Learn" />
        </a>
        <nav aria-label="頁尾導覽">
          <a href="start.html">如何開始</a>
          <a href="explore.html">自我探索</a>
          <a href="methods.html">學習方法</a>
          <a href="games.html">遊戲練習</a>
          <a href="resources.html">資源專區</a>
          <a href="about.html">關於我們</a>
        </nav>
        <div class="socials" aria-label="社群連結">
          <a href="#" aria-label="Instagram"><img src="../images/icon_instagram.png" alt="" loading="lazy" decoding="async" /></a>
          <a href="#" aria-label="Facebook"><img src="../images/icon_facebook.png" alt="" loading="lazy" decoding="async" /></a>
          <a href="#" aria-label="YouTube"><img src="../images/icon_youtube.png" alt="" loading="lazy" decoding="async" /></a>
          <a href="#" aria-label="Email"><img src="../images/icon_email.png" alt="" loading="lazy" decoding="async" /></a>
        </div>
      </footer>

      <div class="modal-overlay" data-modal-overlay hidden>
        <div class="coming-soon-modal" role="dialog" aria-modal="true" aria-labelledby="coming-soon-title">
          <h2 id="coming-soon-title">開發中，敬請期待</h2>
        </div>
      </div>
    </div>
    <script src="../js/games/fraction-decimal-game.js"></script>
    <script src="../js/main.js"></script>
  </body>
</html>
